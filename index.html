<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>遠行時光・旅途分帳與公基金小幫手</title>

  <!-- Firebase 相容版本 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* ========================================================
       低飽和日系四季粉柔色盤 (春・夏・秋・冬)
       ======================================================== */
    :root {
      --bg-warm: #FAF8F8;
      --card-bg: #FFFFFF;
      --text-main: #3C3835;
      --text-muted: #7E7670;
      --text-light: #B2AAA4;
      --border-soft: #EDE8E3;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;

      /* 預設為：🌸 春・櫻落粉 */
      --theme-main: #C88A8A;
      --theme-dark: #8E5656;
      --theme-light: #F7EEEE;
      --theme-border: #E8D3D3;
      --kitty-gradient-1: #D29898;
      --kitty-gradient-2: #B37474;

      /* 水墨山水聯動色 */
      --art-stroke: #C88A8A;
      --art-ink-blur: #F7EEEE;
    }

    body[data-theme="spring"] {
      --bg-warm: #FAF8F8;
      --theme-main: #C88A8A;
      --theme-dark: #8E5656;
      --theme-light: #F7EEEE;
      --theme-border: #E8D3D3;
      --kitty-gradient-1: #D29898;
      --kitty-gradient-2: #B37474;
      --art-stroke: #C88A8A;
      --art-ink-blur: #F7EEEE;
    }

    body[data-theme="summer"] {
      --bg-warm: #F8FAF8;
      --theme-main: #7D9D8B;
      --theme-dark: #577564;
      --theme-light: #EBF2ED;
      --theme-border: #D2E3D7;
      --kitty-gradient-1: #8EAC9B;
      --kitty-gradient-2: #6B8C7A;
      --art-stroke: #7D9D8B;
      --art-ink-blur: #EBF2ED;
    }

    body[data-theme="autumn"] {
      --bg-warm: #FAF9F6;
      --theme-main: #BFA06E;
      --theme-dark: #917548;
      --theme-light: #F7F2EA;
      --theme-border: #EADBCA;
      --kitty-gradient-1: #C9AD7F;
      --kitty-gradient-2: #A88B5B;
      --art-stroke: #BFA06E;
      --art-ink-blur: #F7F2EA;
    }

    body[data-theme="winter"] {
      --bg-warm: #F8FAFB;
      --theme-main: #7B9EA8;
      --theme-dark: #58757E;
      --theme-light: #EBF2F4;
      --theme-border: #D2E2E6;
      --kitty-gradient-1: #8CAAB3;
      --kitty-gradient-2: #6D8E98;
      --art-stroke: #7B9EA8;
      --art-ink-blur: #EBF2F4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-warm);
      color: var(--text-main);
      padding-bottom: 96px;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.5;
      transition: background-color 0.3s ease;
    }

    .header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-soft);
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 10px 16px;
    }
    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }
    .brand-leaf {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--theme-main);
      flex-shrink: 0;
      transition: background-color 0.3s ease;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .role-badge {
      font-size: 11px;
      letter-spacing: 0.5px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      background: none;
      border: none;
      padding: 0 1px;
    }
    .role-admin { color: var(--theme-dark); }
    .role-viewer { color: var(--theme-dark); }

    .vip-status-tag {
      font-size: 10.5px;
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 500;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .vip-status-tag.pro {
      background: var(--theme-light);
      color: var(--theme-dark);
      border: 1px solid var(--theme-border);
    }
    .vip-status-tag.trial {
      background: #F4F1EE;
      color: var(--text-muted);
      border: 1px solid var(--border-soft);
    }

    .theme-picker-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      padding: 2px 4px;
      margin-left: auto;
    }
    .theme-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      outline: none;
      transition: transform 0.2s, border-color 0.2s;
    }
    .theme-dot:active { transform: scale(0.9); }
    .theme-dot.active {
      border-color: #3C3835;
      transform: scale(1.15);
    }
    .theme-dot-spring { background-color: #D29898; }
    .theme-dot-summer { background-color: #8EAC9B; }
    .theme-dot-autumn { background-color: #C9AD7F; }
    .theme-dot-winter { background-color: #8CAAB3; }

    .header-actions-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-soft);
      overflow-x: auto;
    }
    
    .btn-header-sub {
      font-size: 11px;
      color: var(--text-muted);
      background: #FFFFFF;
      border: 1px solid var(--border-soft);
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-header-sub:hover {
      background: var(--bg-warm);
      color: var(--text-main);
    }

    .btn-reset-all {
      font-size: 11px;
      color: var(--text-muted);
      background: #FFFFFF;
      border: 1px solid var(--border-soft);
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      margin-left: auto;
      flex-shrink: 0;
    }
    .btn-reset-all:hover {
      background: var(--bg-warm);
      color: #BA7C7C;
      border-color: #BA7C7C;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .lake-scene-container {
      position: relative;
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .lake-scene-svg {
      width: 100%;
      max-width: 330px;
      height: auto;
      display: block;
    }

    .room-lobby-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      padding: 18px 16px 24px 16px;
      box-shadow: 0 4px 20px rgba(60, 56, 53, 0.02);
      margin-top: 4px;
    }

    .lobby-accordion-btn {
      width: 100%;
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 10px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
      outline: none;
    }
    .lobby-accordion-btn:hover {
      background: var(--theme-light);
      border-color: var(--theme-border);
    }
    .lobby-accordion-btn span {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--theme-dark);
      letter-spacing: 0.3px;
    }
    .lobby-accordion-arrow {
      font-size: 12px;
      color: var(--text-muted);
      transition: transform 0.25s ease;
    }
    .lobby-accordion-btn.active {
      background: var(--theme-light);
      border-color: var(--theme-border);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      margin-bottom: 0;
    }
    .lobby-accordion-btn.active .lobby-accordion-arrow {
      transform: rotate(180deg);
    }

    .lobby-accordion-drawer {
      display: none;
      background: #FFFFFF;
      border: 1px solid var(--border-soft);
      border-top: none;
      border-bottom-left-radius: var(--radius-md);
      border-bottom-right-radius: var(--radius-md);
      padding: 16px 14px 18px 14px;
      margin-bottom: 12px;
      text-align: left;
    }
    .lobby-box-title {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      display: block;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-soft);
      padding: 14px 15px;
      box-shadow: 0 2px 10px rgba(60, 56, 53, 0.02);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    /* 統一規格方塊按鈕樣式 (依結算明細複製清單為準) */
    .btn-action-bordered {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      color: var(--text-muted);
      white-space: nowrap;
      line-height: 1.4;
      transition: all 0.2s;
    }
    .btn-action-bordered:hover {
      background: #FFFFFF;
      color: var(--theme-dark);
      border-color: var(--theme-border);
    }

    .kitty-toggle-banner {
      background: var(--bg-warm);
      border: 1px dashed var(--theme-border);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .kitty-toggle-banner:hover { background: var(--theme-light); }
    .kitty-toggle-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--theme-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kitty-toggle-btn {
      background: var(--theme-main);
      color: #FFF;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    .kitty-compact-card {
      background: linear-gradient(135deg, var(--kitty-gradient-1), var(--kitty-gradient-2));
      color: #FFFFFF;
      border: none;
      padding: 15px 16px;
      box-shadow: 0 4px 14px rgba(60, 56, 53, 0.08);
      transition: background 0.3s ease;
    }
    .kitty-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .kitty-left {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .kitty-label {
      font-size: 11px;
      opacity: 0.92;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }
    .kitty-amount {
      font-size: 23px;
      font-weight: 600;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      letter-spacing: 0.5px;
      line-height: 1;
      white-space: nowrap;
    }
    .kitty-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-kitty-sm {
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #FFFFFF;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 16px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-kitty-sm:hover { background: rgba(255, 255, 255, 0.32); }
    .kitty-custodian-bar {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      opacity: 0.95;
    }
    .custodian-select {
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }
    .custodian-select option { color: var(--text-main); }

    .btn-del-kitty {
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #FFFFFF;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-del-kitty:hover {
      background: #BA7C7C;
      border-color: #BA7C7C;
      color: #FFFFFF;
    }

    .chips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 6px;
      margin-top: 10px;
      width: 100%;
    }
    .member-chip {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: var(--theme-light);
      border: 1px solid var(--theme-border);
      padding: 6px 18px 6px 8px;
      border-radius: 16px;
      font-size: 12px;
      color: var(--theme-dark);
      min-width: 0;
      text-align: center;
      transition: all 0.3s ease;
    }
    .member-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
      width: 100%;
      text-align: center;
      font-weight: 500;
    }
    .chip-del {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 13px;
      cursor: pointer;
      line-height: 1;
    }
    .chip-del:hover { color: #BA7C7C; }

    .split-chip {
      border: 1px solid var(--border-soft);
      background: var(--bg-warm);
      color: var(--text-light);
      font-size: 12px;
      padding: 6px 6px;
      border-radius: 16px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
      outline: none;
      width: 100%;
      text-decoration: line-through;
      opacity: 0.55;
    }
    .split-chip.active {
      background: var(--theme-light);
      border-color: var(--theme-border);
      color: var(--theme-dark);
      font-weight: 600;
      text-decoration: none;
      opacity: 1;
    }

    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .input-text {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border-soft);
      background: var(--bg-warm);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-text:focus {
      border-color: var(--theme-main);
      background: #FFFFFF;
    }
    
    .btn-add {
      background: var(--theme-main);
      color: #FFFFFF;
      border: none;
      padding: 8px 15px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      letter-spacing: 0.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .btn-add:hover { opacity: 0.88; }

    .form-group { margin-bottom: 10px; }
    .form-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .form-select {
      width: 100%;
      border: 1px solid var(--border-soft);
      background: var(--bg-warm);
      border-radius: var(--radius-sm);
      padding: 8px 8px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .custom-box {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 10px 10px;
      margin-bottom: 10px;
    }
    .custom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-toggle-custom {
      background: none;
      border: none;
      color: var(--theme-dark);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .custom-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
    }

    .btn-submit-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-clear-form {
      background: #F4F1EE;
      border: 1px solid var(--border-soft);
      color: var(--text-muted);
      padding: 9px 0;
      border-radius: var(--radius-sm);
      font-size: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }
    .btn-save-expense {
      background: var(--theme-main);
      color: #FFFFFF;
      border: none;
      padding: 9px 0;
      border-radius: var(--radius-sm);
      font-size: 13px;
      letter-spacing: 0.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .btn-save-expense:hover { opacity: 0.9; }

    .expense-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
    }
    .expense-item:last-child { border-bottom: none; }
    .expense-main-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-del-expense {
      background: none;
      border: none;
      color: #BA7C7C;
      font-size: 11px;
      cursor: pointer;
      margin-left: 8px;
    }
    .expense-detail-drawer {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .settle-card {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .settle-amount {
      color: var(--theme-dark);
      font-size: 14px;
      font-weight: 600;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      white-space: nowrap;
    }

    .account-card {
      background: var(--bg-warm);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .account-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 6px;
      width: 100%;
    }
    .bank-code-input {
      width: 68px;
      flex-shrink: 0;
      text-align: center;
      border: 1px solid var(--border-soft);
      background: #FFFFFF;
      border-radius: 6px;
      padding: 6px 4px;
      font-size: 12px;
      outline: none;
    }
    .bank-account-input {
      flex: 1 1 auto;
      min-width: 0;
      border: 1px solid var(--border-soft);
      background: #FFFFFF;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
    }
    .btn-copy-sm {
      flex-shrink: 0;
      background: #FFFFFF;
      border: 1px solid var(--theme-border);
      color: var(--theme-dark);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }

    .empty-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      padding: 12px 0;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(60, 56, 53, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-box {

    async function hashPin(pin) {
      if (!pin) return "";
      const encoder = new TextEncoder();
      const data = encoder.encode(String(pin).trim());
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

      if (state.proUntil && Number(state.proUntil) > Date.now()) return true;

    function getRemainingDays() {
      if (!state.proUntil) return state.isProVersion ? 999 : 0;
      const diff = Number(state.proUntil) - Date.now();
      return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
    }

    async function createNewTripRoom() {
      const code = document.getElementById('customRoomCodeInput').value.trim().toLowerCase();
      const pin = document.getElementById('customRoomPinInput').value.trim();

      if (!code) return showToast('請填寫旅程代碼');
      if (!/^[a-z0-9_-]+$/.test(code)) return showToast('代碼限英數字或連字號');
      if (!/^\d{4}$/.test(pin)) return showToast('密碼請填 4 碼純數字');

      const hashedPin = await hashPin(pin);

      if (!db) {
        window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
        return;
      }

      db.ref('trips/' + code).once('value', (snap) => {
        const val = snap.val();
        if (snap.exists() && val && val.createdAt) {
          showToast('此代碼已存在，請由此加入旅程');
          document.getElementById('joinRoomCodeInput').value = code;
          toggleLobbyAccordion('join');
        } else {
          db.ref('trips/' + code).set({
            createdAt: Date.now(),
            adminPin: hashedPin,
            password: hashedPin,
            isProVersion: false,
            proUntil: null,
            kittyEnabled: false,
            members: [],
            custodian: "",
            kittyDeposits: [],
            expenses: [],
            memberBanks: {}
          }, (err) => {
            if (err) return showToast("建立失敗：" + err.message);
            sessionStorage.setItem('godutch_auth_' + code, hashedPin);
            sessionStorage.setItem('godutch_raw_pin_' + code, pin);
            sessionStorage.setItem('godutch_just_created_' + code, 'trial');
            window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
          });
        }
      });
    }

    async function joinExistingRoom() {
      const code = document.getElementById('joinRoomCodeInput').value.trim().toLowerCase();
      const inputPass = document.getElementById('joinRoomPinInput').value.trim();

      if (!code) return showToast('請輸入旅程代碼');

      if (db) {
        db.ref('trips/' + code).once('value', async (snap) => {
          if (!snap.exists() || !snap.val()) {
            return showToast('查無此旅程，請確認代碼');
          }
          
          const roomData = snap.val();
          if (inputPass) {
            if (!/^\d{4}$/.test(inputPass)) {
              return showToast('管理密碼需為 4 碼純數字');
            }

            const rawDbPass = (roomData.adminPin !== undefined && roomData.adminPin !== "") 
                              ? roomData.adminPin 
                              : roomData.password;

            if (rawDbPass === undefined || rawDbPass === null || rawDbPass === "") {
              return showToast('此旅程無密碼，請直接加入');
            }

            const dbPass = String(rawDbPass).trim();
            const userHashedPass = await hashPin(inputPass);

            if (dbPass === userHashedPass || dbPass === String(inputPass).trim()) {
              sessionStorage.setItem('godutch_auth_' + code, dbPass);
              sessionStorage.setItem('godutch_raw_pin_' + code, inputPass);
              window.location.href = `${window.location.pathname}?trip=${code}&admin=1`;
            } else {
              showToast('管理密碼錯誤，請重新確認');
            }
          } else {
            window.location.href = `${window.location.pathname}?trip=${code}`;
          }
        });
      } else {
        window.location.href = `${window.location.pathname}?trip=${code}`;
      }
    }

    async function initDataSync() {
      if (!currentTripId) {
        document.getElementById('roomLobbySection').style.display = 'block';
        document.getElementById('mainAppSection').style.display = 'none';
        document.getElementById('subHeaderBar').style.display = 'none';
        document.getElementById('roleBadge').style.display = 'none';
        document.getElementById('vipBadge').style.display = 'none';
        return;
      }

      if (db) {
        const snap = await db.ref('trips/' + currentTripId).once('value');
        if (!snap.exists() || !snap.val()) {
          showToast('查無此旅程，返回大廳');
          setTimeout(() => { window.location.href = window.location.pathname; }, 1200);
          return;
        }

        const data = snap.val();
        const activePin = String(data.adminPin || data.password || "").trim();

        if (isAdmin && activePin) {
          const cachedPin = sessionStorage.getItem('godutch_auth_' + currentTripId);
          if (cachedPin !== activePin) {
            const entered = await requestPinFromModal();
            if (entered) {
              const enteredHashed = await hashPin(entered);
              if (enteredHashed === activePin || entered.trim() === activePin) {
                sessionStorage.setItem('godutch_auth_' + currentTripId, activePin);
                sessionStorage.setItem('godutch_raw_pin_' + currentTripId, entered.trim());
                isAdmin = true;
              } else {
                isAdmin = false;
                window.history.replaceState({}, '', `${window.location.pathname}?trip=${currentTripId}`);
                showToast('密碼錯誤，切換為檢視模式');
              }
            } else {
              isAdmin = false;
              window.history.replaceState({}, '', `${window.location.pathname}?trip=${currentTripId}`);
              showToast('已進入旅伴檢視模式');
            }
          }
        }
      }

      document.getElementById('roomLobbySection').style.display = 'none';
      document.getElementById('mainAppSection').style.display = 'flex';
      document.getElementById('tripTitleDisplay').innerText = `${currentTripId}`;
      document.getElementById('roleBadge').style.display = 'inline';
      document.getElementById('subHeaderBar').style.display = 'flex';

      updateRoleUI();

      const justCreatedType = sessionStorage.getItem('godutch_just_created_' + currentTripId);
      if (justCreatedType === 'trial') {
        sessionStorage.removeItem('godutch_just_created_' + currentTripId);
        setTimeout(() => {
          showToast('🌱 目前為體驗版（上限 5 位旅伴、3 筆花費），可隨時升級解鎖。');
        }, 800);
      }

      if (db) {
        tripRef = db.ref('trips/' + currentTripId);
        tripRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            state.createdAt = val.createdAt || Date.now();
            state.adminPin = val.adminPin || val.password || "";
            state.password = val.password || val.adminPin || "";
            state.proUntil = val.proUntil || null;
            state.isProVersion = isTripVipValid();
            state.kittyEnabled = (val.kittyEnabled === true);
            
            state.members = Array.isArray(val.members) ? val.members : (val.members ? Object.values(val.members) : []);
            state.custodian = val.custodian || "";
            state.memberBanks = val.memberBanks || {};
            state.kittyDeposits = Array.isArray(val.kittyDeposits) ? val.kittyDeposits : (val.kittyDeposits ? Object.values(val.kittyDeposits) : []);
            state.expenses = Array.isArray(val.expenses) ? val.expenses : (val.expenses ? Object.values(val.expenses) : []);
          } else {
            state = { createdAt: Date.now(), adminPin: "", password: "", isProVersion: false, proUntil: null, kittyEnabled: false, members: [], custodian: "", memberBanks: {}, kittyDeposits: [], expenses: [] };
          }
          selectedSplitters = state.members.slice();
          renderAll();
        });
      }

    function toggleKittyFeature(enable) {
      if (!isAdmin) return;
      if (!enable && getKittyBalance() !== 0) {
        showConfirm('目前公基金仍有餘額，確定要關閉功能嗎？（記錄仍會保留）', () => {
          state.kittyEnabled = false;
          syncState();
          showToast('已關閉公基金功能');
        });
        return;
      }
      state.kittyEnabled = enable;
      syncState();
      showToast(enable ? '已啟用公基金' : '已關閉公基金');
    }

    function getKittyBalance() {
      if (!state.kittyEnabled) return 0;
      const inAmt = (state.kittyDeposits || []).reduce((acc, c) => acc + (Number(c.totalAmount) || 0), 0);
      const outAmt = (state.expenses || []).reduce((acc, c) => acc + (Number(c.kittyDeduction) || 0), 0);
      return inAmt - outAmt;
    }

    function submitKittyDeposit() {
      if (!isAdmin) return;
      const type = document.getElementById('kittyDepositType').value;
      const amount = parseFloat(document.getElementById('kittyAmountInput').value);
      if (isNaN(amount) || amount <= 0) return showToast('請輸入有效金額');

      let payer = "全員";
      let totalAmount = amount;

      if (type === 'all') {
        totalAmount = amount * state.members.length;
      } else if (type === 'single') {
        payer = document.getElementById('kittySingleTarget').value;
        totalAmount = amount;
      } else {
        payer = "自訂收款";
        totalAmount = amount;
      }

      state.kittyDeposits.push({
        id: String(Date.now()),
        type,
        payer,
        amount,
        totalAmount,
        time: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      });

      closeKittyModal();
      syncState();
    }

    function deleteKittyDeposit(id) {
      if (!isAdmin) return;
      state.kittyDeposits = state.kittyDeposits.filter(k => k.id !== String(id));
      syncState();
    }

    function addMember() {
      if (!isAdmin) return;

      if (!isTripVipValid() && state.members.length >= 5) {
        return openStripeCheckout();
      }

      if (state.members.length >= 30) return showToast('旅伴人數已達系統上限 (30人)');
      const input = document.getElementById('memberNameInput');
      const name = input.value ? input.value.trim() : '';
      if (!name) return showToast('請輸入旅伴姓名');
      if (state.members.includes(name)) return showToast('旅伴姓名重複');

      state.members.push(name);
      selectedSplitters.push(name);
      if (!state.custodian) state.custodian = name;
      input.value = '';
      syncState();
    }

    function removeMember(name) {
      if (!isAdmin) return;
      const inUse = state.expenses.some(e => e.payer === name || (e.splitWith && e.splitWith.includes(name)));
      if (inUse) return showToast(`此旅伴已有帳目，無法刪除`);

      state.members = state.members.filter(m => m !== name);
      selectedSplitters = selectedSplitters.filter(n => n !== name);
      if (state.custodian === name) state.custodian = state.members[0] || "";
      delete state.memberBanks[name];
      syncState();
    }

    function clearAllMembers() {
      if (!isAdmin) return;
      if (state.expenses.length > 0) return showToast('已有消費紀錄，請先清空花費');
      showConfirm('確定清空所有名冊旅伴？', () => {
        state.members = [];
        state.custodian = "";
        state.memberBanks = {};
        selectedSplitters = [];
        syncState();
      });
    }

    function renderCustomList() {
      const c = document.getElementById('customList');
      c.innerHTML = customSplits.map((row, idx) => `
        <div class="custom-row">
          <select onchange="customSplits[${idx}].person=this.value" class="form-select" style="width:auto; padding:5px 6px; font-size:12px;">
            ${state.members.map(m => `<option value="${m}" ${m === row.person ? 'selected' : ''}>${m}</option>`).join('')}
          </select>
          <span style="font-size:11px; color:var(--text-muted);">自費</span>
          <input type="number" value="${row.amount || ''}" oninput="customSplits[${idx}].amount=parseFloat(this.value)||0" placeholder="金額" class="input-text" style="width:70px; padding:5px 6px; font-size:12px;">
          <span style="font-size:11px; color:var(--text-muted);">元</span>
          <button type="button" onclick="removeCustomRow(${idx})" style="background:none; border:none; color:#BA7C7C; font-size:14px; cursor:pointer;">&times;</button>
        </div>
      `).join('');
    }

    function toggleSplitterAction(name) {
      const idx = selectedSplitters.indexOf(name);
      if (idx !== -1) selectedSplitters.splice(idx, 1);
      else selectedSplitters.push(name);
      renderSplitButtons();
    }

    function toggleAllSplitters() {
      if (selectedSplitters.length === state.members.length) selectedSplitters = [];
      else selectedSplitters = state.members.slice();
      renderSplitButtons();
    }

    function renderSplitButtons() {
      const c = document.getElementById('splitButtonsContainer');
      if (state.members.length === 0) {
        c.innerHTML = '<span style="font-size:11px; color:var(--text-light); grid-column:1/-1;">請先加入全員名冊</span>';
        return;
      }
      c.innerHTML = state.members.map(m => {
        const active = selectedSplitters.includes(m);
        return `
          <button type="button" class="split-chip ${active ? 'active' : ''}" onclick="toggleSplitterAction('${m}')">
            ${m}
          </button>
        `;
      }).join('');
    }

    function clearExpenseForm() {
      document.getElementById('itemTitle').value = '';
      document.getElementById('itemAmount').value = '';
      document.getElementById('payerSelect').value = (state.kittyEnabled && state.custodian) ? state.custodian : (state.members[0] || '');
      customSplits = [];
      document.getElementById('customArea').style.display = 'none';
      document.getElementById('customToggleBtn').innerText = '＋ 新增自費';
      selectedSplitters = state.members.slice();
      renderSplitButtons();
      renderCustomList();
    }

    function addExpense() {
      if (!isAdmin) return;
      if (state.members.length === 0) return showToast('請先加入旅伴名冊');

      if (!isTripVipValid() && state.expenses.length >= 3) {
        return openStripeCheckout();
      }

      if (state.expenses.length >= 300) return showToast('消費筆數已達系統上限 (300筆)');

      const titleInput = document.getElementById('itemTitle');
      const amountInput = document.getElementById('itemAmount');
      const payerSelect = document.getElementById('payerSelect');

      const title = titleInput.value ? titleInput.value.trim() : '';
      const amount = parseFloat(amountInput.value);
      const payer = payerSelect.value;

      if (!title) return showToast('請填寫支出品項');
      if (isNaN(amount) || amount <= 0) return showToast('請輸入有效金額');
      if (!payer) return showToast('請選擇付款人');

      const customSum = customSplits.reduce((acc, c) => acc + (Number(c.amount) || 0), 0);
      if (customSum > amount) return showToast('自費金額大於總支出');
      if (selectedSplitters.length === 0 && (amount - customSum) > 0) return showToast('請選擇分攤旅伴');

      let kittyDeduction = 0;
      let personalPaid = amount;

      if (state.kittyEnabled && payer === state.custodian) {
        const currentKitty = getKittyBalance();
        if (currentKitty > 0) {
          kittyDeduction = Math.min(amount, currentKitty);
          personalPaid = amount - kittyDeduction;
        }
      }

      state.expenses.push({
        id: String(Date.now()),
        title,
        amount,
        payer,
        kittyDeduction,
        personalPaid,
        customSplits: customSplits.filter(c => c.amount > 0),
        splitWith: selectedSplitters.slice()
      });

      clearExpenseForm();
      syncState();
    }

    function deleteExpense(id) {
      if (!isAdmin) return;
      state.expenses = state.expenses.filter(e => e.id !== String(id));
      syncState();
    }

    function clearAllExpenses() {
      if (!isAdmin) return;
      if (state.expenses.length === 0) return;
      showConfirm('確定清空所有花費紀錄？', () => {
        state.expenses = [];
        syncState();
      });
    }

    // ==========================================
    // 7. 統計與結算
    // ==========================================
    function computeMemberStatistics() {
      const stats = {};
      state.members.forEach(m => {
        stats[m] = { totalSpent: 0, totalPaid: 0 };
      });

      state.expenses.forEach(exp => {
        const paidAmt = state.kittyEnabled 
          ? (Number(exp.personalPaid) || 0) 
          : (Number(exp.amount) || 0);

        if (stats[exp.payer]) {
          stats[exp.payer].totalPaid += paidAmt;
        }

        let rest = exp.amount;
        if (Array.isArray(exp.customSplits)) {
          exp.customSplits.forEach(cs => {
            if (stats[cs.person]) {
              stats[cs.person].totalSpent += Number(cs.amount) || 0;
              rest -= Number(cs.amount) || 0;
            }
          });
        }

        if (Array.isArray(exp.splitWith) && exp.splitWith.length > 0 && rest > 0) {
          const splitUnit = rest / exp.splitWith.length;
          exp.splitWith.forEach(p => {
            if (stats[p]) stats[p].totalSpent += splitUnit;
          });
        }
      });

      return stats;
    }

    function computeSettlement() {
      const balance = {};
      state.members.forEach(m => balance[m] = 0);

      if (state.kittyEnabled && Array.isArray(state.kittyDeposits)) {
        state.kittyDeposits.forEach(d => {
          if (d.type === 'all') {
            const perPerson = Number(d.amount) || 0;
            state.members.forEach(m => balance[m] += perPerson);
          } else if (d.type === 'single') {
            if (balance[d.payer] !== undefined) {
              balance[d.payer] += (Number(d.totalAmount) || 0);
            }
          } else {
            const perPerson = (Number(d.totalAmount) || 0) / (state.members.length || 1);
            state.members.forEach(m => balance[m] += perPerson);
          }
        });
      }

      state.expenses.forEach(exp => {
        const effectivePaid = state.kittyEnabled 
          ? (Number(exp.personalPaid) || 0) 
          : (Number(exp.amount) || 0);

        if (balance[exp.payer] !== undefined) {
          balance[exp.payer] += effectivePaid;
        }

        let rest = exp.amount;
        if (Array.isArray(exp.customSplits)) {
          exp.customSplits.forEach(cs => {
            if (balance[cs.person] !== undefined) {
              balance[cs.person] -= cs.amount;
              rest -= cs.amount;
            }
          });
        }

        if (Array.isArray(exp.splitWith) && exp.splitWith.length > 0 && rest > 0) {
          const splitAmt = rest / exp.splitWith.length;
          exp.splitWith.forEach(p => {
            if (balance[p] !== undefined) balance[p] -= splitAmt;
          });
        }
      });

      const kittyBal = getKittyBalance();
      if (state.kittyEnabled && state.custodian && balance[state.custodian] !== undefined) {
        balance[state.custodian] -= kittyBal;
      }

      const debtors = [];
      const creditors = [];
      for (const [person, net] of Object.entries(balance)) {
        const rounded = Math.round(net);
        if (rounded < -0.5) debtors.push({ person, amount: -rounded });
        else if (rounded > 0.5) creditors.push({ person, amount: rounded });
      }

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transactions = [];
      let i = 0, j = 0;
      const debtorsCopy = debtors.map(d => ({ ...d }));
      const creditorsCopy = creditors.map(c => ({ ...c }));

      while (i < debtorsCopy.length && j < creditorsCopy.length) {
        const d = debtorsCopy[i];
        const cr = creditorsCopy[j];
        const amt = Math.min(d.amount, cr.amount);

        transactions.push({ from: d.person, to: cr.person, amount: amt });
        d.amount -= amt;
        cr.amount -= amt;

        if (d.amount === 0) i++;
        if (cr.amount === 0) j++;
      }

      return { transactions, creditors, kittyLeftover: state.kittyEnabled ? kittyBal : 0 };
    }

    function updateMemberBank(person, field, val) {
      if (!state.memberBanks[person]) state.memberBanks[person] = { code: "", account: "" };
      state.memberBanks[person][field] = val.trim();
      if (tripRef) {
        tripRef.child(`memberBanks/${person}/${field}`).set(val.trim());
      }
    }

    // ==========================================
    // 8. 畫面渲染
    // ==========================================
    function renderAll() {
      const vipBadge = document.getElementById('vipBadge');
      if (currentTripId) {
        vipBadge.style.display = 'inline-flex';
        if (isTripVipValid()) {
          const days = getRemainingDays();
          vipBadge.innerText = days > 365 ? '✨ VIP 完整版' : `✨ VIP 剩 ${days} 天`;
          vipBadge.className = 'vip-status-tag pro';
        } else {
          vipBadge.innerText = '🌱 體驗版 (解鎖)';
          vipBadge.className = 'vip-status-tag trial';
        }
      } else {
        vipBadge.style.display = 'none';
      }

      const inactiveBanner = document.getElementById('kittyInactiveBanner');
      const activeCard = document.getElementById('kittyActiveCard');

      if (state.kittyEnabled) {
        inactiveBanner.style.display = 'none';
        activeCard.style.display = 'block';
      } else {
        inactiveBanner.style.display = 'flex';
        activeCard.style.display = 'none';
      }

      const kittyBal = getKittyBalance();
      document.getElementById('kittyBalanceDisplay').innerText = `$${Math.round(kittyBal).toLocaleString()}`;

      const cSelect = document.getElementById('custodianSelect');
      cSelect.innerHTML = `<option value="">未指定</option>` + state.members.map(m => 
        `<option value="${m}" ${state.custodian === m ? 'selected' : ''}>${m}</option>`
      ).join('');

      const kLogs = document.getElementById('kittyDepositLogs');
      if (!state.kittyDeposits || state.kittyDeposits.length === 0) {
        kLogs.innerHTML = '<span style="opacity:0.75;">尚無公基金收款紀錄</span>';
      } else {
        kLogs.innerHTML = state.kittyDeposits.map(k => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed rgba(255,255,255,0.15);">
            <span>${k.time} · ${k.payer} · $${k.totalAmount.toLocaleString()}</span>
            ${isAdmin ? `<button type="button" class="btn-del-kitty" onclick="deleteKittyDeposit('${k.id}')" title="刪除收款紀錄">✕</button>` : ''}
          </div>
        `).join('');
      }

      const stats = computeMemberStatistics();
      const statsBox = document.getElementById('memberStatsContainer');
      if (state.members.length === 0) {
        statsBox.innerHTML = '<p class="empty-hint">尚未加入全員名冊</p>';
      } else {
        statsBox.innerHTML = state.members.map(m => {
          const item = stats[m] || { totalSpent: 0, totalPaid: 0 };
          return `
            <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-warm); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:7px 10px; font-size:12px;">
              <div>
                <span style="font-weight:500;">${m}</span>
                ${(state.kittyEnabled && m === state.custodian) ? '<span style="font-size:10px; background:var(--theme-light); color:var(--theme-dark); padding:1px 5px; border-radius:3px; margin-left:4px;">總務</span>' : ''}
              </div>
              <div style="display:flex; gap:10px; font-size:11px; font-family:monospace;">
                <span style="color:var(--text-muted);">花費 $${Math.round(item.totalSpent).toLocaleString()}</span>
                <span style="color:var(--theme-dark); font-weight:600;">代墊 $${Math.round(item.totalPaid).toLocaleString()}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('memberCountBadge').innerText = state.members.length;
      const mContainer = document.getElementById('membersContainer');
      mContainer.innerHTML = state.members.map(m => `
        <span class="member-chip">
          <span>${m}</span>
          ${isAdmin ? `<button type="button" class="chip-del" onclick="removeMember('${m}')">&times;</button>` : ''}
        </span>
      `).join('') || '<span class="empty-hint" style="grid-column:1/-1; padding:4px 0;">尚未加入任何名冊成員</span>';

      const pSelect = document.getElementById('payerSelect');
      const curPayer = pSelect.value;
      pSelect.innerHTML = state.members.map(m => {
        const isCustodian = state.kittyEnabled && m === state.custodian;
        return `<option value="${m}" ${(curPayer === m || (!curPayer && isCustodian)) ? 'selected' : ''}>${m}${isCustodian ? ' (公基金優先扣抵)' : ''}</option>`;
      }).join('');

      renderSplitButtons();
      renderCustomList();

      const expList = document.getElementById('expenseList');
      let total = 0;
      if (state.expenses.length === 0) {
        expList.innerHTML = '<p class="empty-hint">尚無花費紀錄</p>';
      } else {
        expList.innerHTML = state.expenses.slice().reverse().map(e => {
          total += Number(e.amount) || 0;
          const isExpanded = expandedExpenseId === e.id;
          const hasKitty = state.kittyEnabled && (e.kittyDeduction > 0);

          return `
            <div class="expense-item">
              <div class="expense-main-row">
                <div>
                  <span style="font-weight:500;">${e.title}</span>
                  <span style="color:var(--theme-dark); font-weight:600; font-family:monospace; margin-left:4px;">$${Math.round(e.amount).toLocaleString()}</span>
                </div>
                <div style="display:flex; align-items:center;">
                  <button type="button" onclick="toggleExpandExpense('${e.id}')" style="background:none; border:none; color:var(--theme-dark); font-size:11px; cursor:pointer;">
                    ${isExpanded ? '收合 ▴' : '明細 ▾'}
                  </button>
                  ${isAdmin ? `<button type="button" class="btn-del-expense" onclick="deleteExpense('${e.id}')">刪除</button>` : ''}
                </div>
              </div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
                ${e.payer} 付 · ${(e.splitWith || []).length} 人分攤
                ${hasKitty ? ` · <span style="color:var(--theme-dark);">(公基金扣抵 $${Math.round(e.kittyDeduction).toLocaleString()}${e.personalPaid > 0 ? ` + 個人代墊 $${Math.round(e.personalPaid).toLocaleString()}` : ''})</span>` : ''}
              </div>
              ${isExpanded ? `
                <div class="expense-detail-drawer">
                  <div style="margin-bottom:3px;"><strong>分攤旅伴：</strong>${(e.splitWith || []).join('、 ')}</div>
                  ${(e.customSplits && e.customSplits.length) ? `<div><strong>特定自費：</strong>${e.customSplits.map(c=>`${c.person}$${c.amount}`).join('、 ')}</div>` : ''}
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      }
      document.getElementById('totalCostDisplay').innerText = `累計：$${Math.round(total).toLocaleString()}`;

      const setList = document.getElementById('settlementList');
      const { transactions, creditors } = computeSettlement();
      if (transactions.length === 0) {
        setList.innerHTML = '<p class="empty-hint">目前帳目已平衡，無須轉帳</p>';
      } else {
        setList.innerHTML = transactions.map(t => `
          <div class="settle-card">
            <span style="font-size:12px;"><strong>${t.from}</strong> ➔ 應轉給 <strong>${t.to}</strong></span>
            <span class="settle-amount">$${t.amount.toLocaleString()}</span>
          </div>
        `).join('');
      }

      const accList = document.getElementById('accountList');
      if (creditors.length === 0) {
        accList.innerHTML = '<span style="font-size:11px; color:var(--text-light);">尚無收款需求</span>';
      } else {
        accList.innerHTML = creditors.map(c => {
          const bankData = state.memberBanks[c.person] || { code: "", account: "" };
          return `
            <div class="account-card">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; font-weight:600;">${c.person}</span>
                <span style="font-size:11px; color:var(--theme-dark); font-weight:600;">應收：$${c.amount.toLocaleString()}</span>
              </div>
              <div class="account-row">
                <input type="text" maxlength="3" class="bank-code-input" placeholder="代碼" value="${bankData.code || ''}" 
                       onchange="updateMemberBank('${c.person}', 'code', this.value)">
                <input type="text" class="bank-account-input" placeholder="帳號" value="${bankData.account || ''}" 
                       onchange="updateMemberBank('${c.person}', 'account', this.value)">
                <button type="button" class="btn-copy-sm" onclick="copyPureAccount('${bankData.account}', '${c.person}')">複製</button>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function toggleExpandExpense(id) {
      expandedExpenseId = (expandedExpenseId === id) ? null : id;
      renderAll();
    }

    function copyPureAccount(acc, name) {
      if (!acc) return showToast(`請先填寫 ${name} 的帳號`);
      copyToClipboard(acc.replace(/[^0-9]/g, ''), `已複製 ${name} 的銀行帳號`);
    }

    function copyToClipboard(txt, msg) {
      if (!txt) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => {
          showToast(msg || '已複製');
        }).catch(() => fallbackCopy(txt, msg));
      } else {
        fallbackCopy(txt, msg);
      }
    }

    function fallbackCopy(txt, msg) {
      const input = document.createElement('textarea');
      input.value = txt;
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      try {
        document.execCommand('copy');
        showToast(msg || '已複製');
      } catch (err) {
        showToast('複製失敗，請手動複製');
      }
      document.body.removeChild(input);
    }

    function copySettlementSummary() {
      const { transactions, creditors, kittyLeftover } = computeSettlement();
      if (transactions.length === 0) return showToast('目前帳目已平衡，無須轉帳');

      let out = '🌾【旅途結算清單】\n';
      transactions.forEach(t => {
        out += `👉 ${t.from} 應轉給 ${t.to}：$${t.amount.toLocaleString()} 元\n`;
      });

      if (state.kittyEnabled && kittyLeftover > 0 && state.custodian) {
        out += `\n💡 備註：公基金剩餘現鈔 $${Math.round(kittyLeftover).toLocaleString()} 已由總務【${state.custodian}】直接抵銷。\n`;
      }

      out += '\n【收款人帳號】\n';
      creditors.forEach(c => {
        const b = state.memberBanks[c.person] || { code: "", account: "" };
        out += `🏦 ${c.person}：銀行代碼 ${b.code || '未填'} 帳號 ${b.account || '未填'}\n`;
      });

      copyToClipboard(out, '已複製結算清單至剪貼簿');
    }

    function resetEntireTrip() {
      if (!isAdmin) return;
      showConfirm('確定清空這趟旅程的所有紀錄嗎？', () => {
        state = { createdAt: Date.now(), adminPin: "", password: "", isProVersion: false, proUntil: null, kittyEnabled: false, members: [], custodian: "", memberBanks: {}, kittyDeposits: [], expenses: [] };
        selectedSplitters = [];
        customSplits = [];
        syncState();
        showToast('已清空旅程所有紀錄');
      });
    }

    // 啟動初始化
    initDataSync();
  </script>
</body>
</html>
