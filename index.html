<!-- 1. 開啟一段新旅程 -->
      <button type="button" class="lobby-accordion-btn" id="btn-accordion-create" onclick="toggleLobbyAccordion('create')">
        <span>1. 開啟一段新旅程</span>
        <span class="lobby-accordion-arrow">▾</span>
      </button>
      <div id="drawer-create" class="lobby-accordion-drawer">
        <span class="lobby-box-title">自訂好記的旅程代號與總務管理密碼。</span>
        
        <div style="margin-bottom:8px;">
          <input type="text" id="customRoomCodeInput" class="input-text" placeholder="旅程代碼 (例如 tokyo2026)" style="width:100%; font-family:monospace; text-transform:lowercase;">
        </div>
        
        <div style="margin-bottom:12px;">
          <input type="password" maxlength="4" pattern="\d{4}" inputmode="numeric" id="customRoomPinInput" class="input-text" style="width:100%; font-family:monospace;" placeholder="總務密碼 (4碼數字)">
        </div>
        
        <!-- 體驗版說明與每季 60 元解鎖按鈕 -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding:0 2px;">
          <span style="font-size:11px; color:var(--text-muted); letter-spacing:0.3px;">體驗版僅能輸入5位旅伴、3筆紀錄</span>
          <button type="button" class="btn-header-sub" style="padding:4px 10px; font-size:11px; flex-shrink:0;" onclick="openStripeCheckout()">購買 ($60/季)</button>
        </div>

        <button type="button" class="btn-save-expense" style="width:100%; font-size:12px;" onclick="createNewTripRoom()">建立並以總務身分進入</button>
      </div>
